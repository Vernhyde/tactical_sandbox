[package]
name = "tactical_sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = { version = "0.20.1", features = ["dynamic_linking"] }

[features]
default = []
dynamic_linking = ["bevy/dynamic_linking"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
